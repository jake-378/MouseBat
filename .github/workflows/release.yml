name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build lightweight app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          dotnet build .\MouseBat.csproj -c Release -p:Version=$version
          New-Item -ItemType Directory -Force .\publish | Out-Null
          Copy-Item .\bin\Release\net48\* .\publish -Recurse -Force
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build setup
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup *\ISCC.exe' | Select-Object -First 1 -ExpandProperty FullName
          & $iscc "/DAppVersion=$version" .\installer\MouseBat.iss
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          gh release create $env:RELEASE_TAG ".\installer-output\MouseBat-Setup-$version.exe" --title "MouseBat $env:RELEASE_TAG" --generate-notes
